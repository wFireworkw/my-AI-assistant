<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой ИИ помощник</title>
    <link rel="stylesheet" href="./ИИ помошник.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>ИИ Помощник</h1>
        </div>
        <div class="chat-messages" id="chatMessages">
        </div>
        <div class="chat-input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Задай вопрос ИИ..."
                    autocomplete="off"
                >
                <button id="sendButton" class="send-button" type="button" aria-label="Отправить сообщение">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="./ИИ помошник.js"></script>
</body>
</html>
